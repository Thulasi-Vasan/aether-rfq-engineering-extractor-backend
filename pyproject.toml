[project]
name = "aether-rfq-engineering-extractor-backend"
version = "0.1.0"
description = "FastAPI + Bedrock (boto3) agent that extracts machining operations from a drawing PDF + STEP file."
requires-python = ">=3.10"
# NOTE: pythonocc-core is intentionally NOT listed here — it is conda-only and
# already provided by the `cad-occ` conda env. uv manages the rest, installed
# INTO that env (see README).
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "boto3>=1.34",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
